name: 'Run Unit Tests'
description: 'Setup dependencies and run unit tests for all packages'
inputs:
  shell:
    description: 'Shell to use (bash, pwsh)'
    required: false
    default: 'bash'
runs:
  using: 'composite'
  steps:
    - name: Test Package bruno-js
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/js

    - name: Test Package bruno-cli
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/cli

    - name: Test Package bruno-query
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/query

    - name: Test Package bruno-lang
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/lang

    - name: Test Package bruno-schema
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/schema

    - name: Test Package bruno-app
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/app

    - name: Test Package bruno-common
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/common

    - name: Test Package bruno-converters
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/converters

    - name: Test Package bruno-electron
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/electron

    - name: Test Package bruno-requests
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/requests

    - name: Test Package bruno-filestore
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/filestore

    - name: Test Package bruno-sqlite
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/sqlite
